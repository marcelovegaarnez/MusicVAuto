name: Construir APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Copiar plugin nativo y actividad
        run: |
          DEST=android/app/src/main/java/com/marcelovega/automusic
          mkdir -p "$DEST"
          cp android-src/MusicFolderPlugin.java "$DEST/MusicFolderPlugin.java"
          cp android-src/MainActivity.java "$DEST/MainActivity.java"
          cp android-src/BootReceiver.java "$DEST/BootReceiver.java"

      - name: Ajustar manifiesto (horizontal, WAKE_LOCK, inicio automático)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' "$M"
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n</manifest>#' "$M"
          sed -i 's#</application>#    <receiver android:name="com.marcelovega.automusic.BootReceiver" android:enabled="true" android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.BOOT_COMPLETED" />\n                <action android:name="android.intent.action.QUICKBOOT_POWERON" />\n                <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />\n            </intent-filter>\n        </receiver>\n    </application>#' "$M"
          cat "$M"

      - name: Sincronizar web
        run: npx cap sync android

      - name: Compilar APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: auto-musica-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
